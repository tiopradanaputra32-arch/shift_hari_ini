<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Shift Hari Ini – Long April</title>

<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    font-family: Arial, Helvetica, sans-serif;
    background: #0e0e0e;
    color: #ffffff;
  }

  h1 {
    margin-bottom: 20px;
    font-size: 26px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
  }

  .card {
    background: linear-gradient(180deg,#1b1b1b,#121212);
    border-radius: 14px;
    padding: 16px;
    text-align: center;
    border: 1px solid #2a2a2a;
  }

  .photo {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    margin: 0 auto 12px;
    overflow: hidden;
    background: #333;
  }

  .photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .name {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 4px;
  }

  .division {
    font-size: 14px;
    color: #ffc107;
    margin-bottom: 6px;
  }

  .shift {
    font-size: 13px;
    opacity: 0.9;
  }

  .empty {
    opacity: 0.6;
    font-style: italic;
  }
</style>
</head>

<body>

<h1>📅 Shift Hari Ini</h1>
<div class="grid" id="container"></div>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTuQlF43hDnYKrFQi2s8Q93aonmYTQKSVTRrcLBaf3yJLI4rElEtJEiARSfnBIYwYPvMwpuvj8eIvIY/pub?gid=1136472262&single=true&output=csv";

fetch(CSV_URL)
  .then(res => res.text())
  .then(csv => {
    const rows = csv.trim().split("\n").slice(1);
    const container = document.getElementById("container");

    if (rows.length === 0) {
      container.innerHTML = "<div class='empty'>Tidak ada shift hari ini</div>";
      return;
    }

    rows.forEach(row => {
      const cols = row.split(",");
      const nama   = cols[1]?.trim();
      const divisi = cols[2]?.trim();
      const shift  = cols[3]?.trim();
      const foto   = cols[4]?.trim(); // boleh kosong

      if (!nama) return;

      container.innerHTML += `
        <div class="card">
          <div class="photo">
            <img src="${foto || 'https://i.imgur.com/8Km9tLL.png'}">
          </div>
          <div class="name">${nama}</div>
          <div class="division">${divisi}</div>
          <div class="shift">${shift}</div>
        </div>
      `;
    });
  })
  .catch(() => {
    document.getElementById("container").innerHTML =
      "<div class='empty'>Gagal load data</div>";
  });
</script>

</body>
</html>
