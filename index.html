<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Long April System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#0b0b0b;
  color:#fff;
  overflow:hidden;
}

/* ================= LOGIN SCREEN ================= */
#loginScreen{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#0b0b0b;
  z-index:10;
}

.login-box{
  background:rgba(20,20,20,.85);
  border-radius:20px;
  padding:26px 28px;
  text-align:center;
  box-shadow:0 0 40px rgba(0,0,0,.6);
  backdrop-filter:blur(8px);
}

.login-box h1{
  margin:12px 0 18px;
  font-size:22px;
}

.login-btn{
  padding:12px 26px;
  border:none;
  border-radius:30px;
  background:linear-gradient(135deg,#ff9800,#ffc107);
  font-weight:bold;
  cursor:pointer;
}

/* ================= SPLINE ROBOT ================= */
#robotWrapper{
  position:fixed;
  inset:0;
  z-index:1;
}

#robotWrapper iframe{
  width:100%;
  height:100%;
  border:none;
}

/* ================= SHIFT PAGE ================= */
#shiftPage{
  display:none;
  padding:24px;
  overflow:auto;
  height:100vh;
}

h2{
  margin-bottom:18px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:16px;
}

.card{
  background:linear-gradient(180deg,#1b1b1b,#121212);
  border-radius:14px;
  padding:16px;
  text-align:center;
  border:1px solid #2a2a2a;
}

.photo{
  width:110px;
  height:110px;
  border-radius:50%;
  margin:0 auto 12px;
  overflow:hidden;
  background:#333;
}

.photo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.name{font-size:17px;font-weight:bold}
.divisi{color:#ffc107;font-size:14px;margin:4px 0}
.shift{font-size:13px;opacity:.9}
.empty{opacity:.6;font-style:italic}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->
<div id="loginScreen">
  <div class="login-box">
    <h1>🤖 Long April System</h1>
    <button class="login-btn" onclick="login()">LOGIN</button>
  </div>
</div>

<!-- ================= ROBOT SPLINE ================= -->
<div id="robotWrapper">
  <iframe 
    src="https://my.spline.design/nexbotrobotcharacterconcept-4BIXj9AKtuPQ0H1tFEFfcGK6/"
    allowfullscreen>
  </iframe>
</div>

<!-- ================= SHIFT PAGE ================= -->
<div id="shiftPage">
  <h2>📅 Shift Hari Ini</h2>
  <div class="grid" id="container"></div>
</div>

<script>
function login(){
  document.getElementById("loginScreen").style.display="none";
  document.getElementById("robotWrapper").style.display="none";
  document.getElementById("shiftPage").style.display="block";
  loadShift();
}

function loadShift(){
  const CSV_URL =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vTuQlF43hDnYKrFQi2s8Q93aonmYTQKSVTRrcLBaf3yJLI4rElEtJEiARSfnBIYwYPvMwpuvj8eIvIY/pub?gid=1136472262&single=true&output=csv";

  fetch(CSV_URL)
    .then(res=>res.text())
    .then(csv=>{
      const rows=csv.trim().split("\n").slice(1);
      const container=document.getElementById("container");
      container.innerHTML="";

      if(!rows.length){
        container.innerHTML="<div class='empty'>Tidak ada shift hari ini</div>";
        return;
      }

      rows.forEach(r=>{
        const c=r.split(",");
        if(!c[1])return;

        container.innerHTML+=`
          <div class="card">
            <div class="photo">
              <img src="${c[4] || 'https://i.imgur.com/8Km9tLL.png'}">
            </div>
            <div class="name">${c[1]}</div>
            <div class="divisi">${c[2]}</div>
            <div class="shift">${c[3]}</div>
          </div>
        `;
      });
    })
    .catch(()=>{
      document.getElementById("container").innerHTML=
      "<div class='empty'>Gagal load data</div>";
    });
}
</script>

</body>
</html>
