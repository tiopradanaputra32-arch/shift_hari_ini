<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shift Hari Ini – Long April</title>

<style>
* { box-sizing:border-box; }
body {
  margin:0;
  padding:24px;
  font-family:Arial, Helvetica, sans-serif;
  background:#0e0e0e;
  color:#fff;
}
h1 {
  margin-bottom:20px;
  font-size:26px;
}
.grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:16px;
}
.card {
  background:linear-gradient(180deg,#1b1b1b,#121212);
  border-radius:14px;
  padding:16px;
  text-align:center;
  border:1px solid #2a2a2a;
}
.photo {
  width:110px;
  height:110px;
  border-radius:50%;
  margin:0 auto 12px;
  overflow:hidden;
  background:#333;
}
.photo img {
  width:100%;
  height:100%;
  object-fit:cover;
}
.name {
  font-size:18px;
  font-weight:bold;
}
.division {
  font-size:14px;
  color:#ffc107;
  margin:4px 0;
}
.shift {
  font-size:13px;
  opacity:.9;
}
.empty {
  opacity:.6;
  font-style:italic;
}
</style>
</head>

<body>

<h1>📅 Shift Hari Ini</h1>
<div class="grid" id="container"></div>

<script>
const CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTuQlF43hDnYKrFQi2s8Q93aonmYTQKSVTRrcLBaf3yJLI4rElEtJEiARSfnBIYwYPvMwpuvj8eIvIY/pub?gid=1136472262&single=true&output=csv";

fetch(CSV_URL)
.then(res => res.text())
.then(text => {
  const rows = text.trim().split(/\r?\n/).slice(1);
  const container = document.getElementById("container");

  if (!rows.length) {
    container.innerHTML = "<div class='empty'>Tidak ada shift hari ini</div>";
    return;
  }

  rows.forEach(r => {
    // CSV SAFE PARSER (anti koma & imgur error)
    const c = r.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g)
               ?.map(v => v.replace(/^"|"$/g,""));

    if (!c || !c[1]) return;

    const nama  = c[1];
    const div   = c[2];
    const shift = c[3];
    const foto  = c[4];

    container.innerHTML += `
      <div class="card">
        <div class="photo">
          <img src="${foto || 'https://i.imgur.com/8Km9tLL.png'}">
        </div>
        <div class="name">${nama}</div>
        <div class="division">${div}</div>
        <div class="shift">${shift}</div>
      </div>
    `;
  });
})
.catch(err => {
  console.error(err);
  document.getElementById("container").innerHTML =
    "<div class='empty'>Gagal load data</div>";
});
</script>

</body>
</html>
