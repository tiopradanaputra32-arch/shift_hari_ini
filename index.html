<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Long April System</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#0e0e0e;
  color:#fff;
  overflow:hidden;
}

/* LOGIN */
#loginScreen{
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#000;
  z-index:10;
}

.login-box{
  background:rgba(20,20,20,.8);
  padding:30px;
  border-radius:18px;
  text-align:center;
  backdrop-filter:blur(10px);
}

.login-box h2{margin-bottom:14px}

.login-box button{
  padding:12px 28px;
  border:none;
  border-radius:30px;
  background:#ffc107;
  font-weight:bold;
  cursor:pointer;
}

/* ROBOT */
#robotFrame{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:none;
}

/* SHIFT */
#shiftScreen{
  display:none;
  padding:24px;
  overflow:auto;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:16px;
}

.card{
  background:#161616;
  border-radius:16px;
  padding:16px;
  text-align:center;
}

.photo{
  width:100px;
  height:100px;
  border-radius:50%;
  overflow:hidden;
  margin:0 auto 10px;
}

.photo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.name{font-weight:bold;font-size:18px}
.divisi{color:#ffc107;font-size:14px}
.shift{font-size:13px;opacity:.9}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen">
  <iframe
    id="robotFrame"
    src="https://my.spline.design/nexbotrobotcharacterconcept-4BIXj9AKtuPQ0H1tFEFfcGK6/"
    allowfullscreen>
  </iframe>

  <div class="login-box">
    <h2>🤖 Long April System</h2>
    <button onclick="login()">LOGIN</button>
  </div>
</div>

<!-- SHIFT -->
<div id="shiftScreen">
  <h1>📅 Shift Hari Ini</h1>
  <div class="grid" id="container"></div>
</div>

<script>
function login(){
  document.getElementById("loginScreen").style.display="none";
  document.getElementById("shiftScreen").style.display="block";
  loadShift();
}

function loadShift(){
  const CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vTuQlF43hDnYKrFQi2s8Q93aonmYTQKSVTRrcLBaf3yJLI4rElEtJEiARSfnBIYwYPvMwpuvj8eIvIY/pub?gid=1136472262&single=true&output=csv";

  fetch(CSV_URL)
  .then(r=>r.text())
  .then(csv=>{
    const rows=csv.trim().split("\n").slice(1);
    const c=document.getElementById("container");
    c.innerHTML="";
    rows.forEach(r=>{
      const d=r.split(",");
      if(!d[1])return;
      c.innerHTML+=`
      <div class="card">
        <div class="photo">
          <img src="${d[4]||'https://i.imgur.com/8Km9tLL.png'}">
        </div>
        <div class="name">${d[1]}</div>
        <div class="divisi">${d[2]}</div>
        <div class="shift">${d[3]}</div>
      </div>`;
    });
  })
  .catch(()=>{
    document.getElementById("container").innerHTML="Gagal load data";
  });
}
</script>

</body>
</html>
